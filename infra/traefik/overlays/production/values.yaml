# Traefik Sovereign Edge Configuration
# RGI Infrastructure OS — Bare Metal Mode

experimental:
  kubernetesCRD: true

service:
  type: LoadBalancer

ports:
  web:
    port: 80
    expose: true
    exposedPort: 80

  websecure:
    port: 443
    expose: true
    exposedPort: 443

  traefik:
    port: 8080
    expose: true
    exposedPort: 8080

ingressRoute:
  dashboard:
    enabled: false

# IMPORTANT:
# No ACME here.
# cert-manager owns TLS in RGI architecture.

additionalArguments:
  - "--entrypoints.web.address=:80"
  - "--entrypoints.websecure.address=:443"
  - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
  - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
  - "--providers.kubernetesingress"
  - "--providers.kubernetescrd"
  - "--log.level=INFO"
  - "--accesslog=true"

env:
  - name: HST_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: hostinger-dns-api
        key: HST_API_TOKEN
