apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-cloudflared-commander-reports
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/asmglobal-cloud/asmglobal-gitops.git
    targetRevision: main
    path: apps/infra-cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: asmglobal-observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
