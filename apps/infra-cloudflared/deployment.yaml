apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-commander-reports
  namespace: asmglobal-observability
  labels:
    app.kubernetes.io/name: cloudflared-commander-reports
    app.kubernetes.io/component: private-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-commander-reports
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-commander-reports
        app.kubernetes.io/component: private-tunnel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.2
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: TUNNEL_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - cloudflared
                - tunnel
                - --metrics
                - 127.0.0.1:2000
                - --no-autoupdate
                - ready
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - cloudflared
                - tunnel
                - --metrics
                - 127.0.0.1:2000
                - --no-autoupdate
                - ready
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
