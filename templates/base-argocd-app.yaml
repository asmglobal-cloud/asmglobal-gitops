apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: {{TENANT_NAME}}-{{TENANT_ENV}}

  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ASMGlobal/asm-gitops-os.git

    targetRevision: release

    path: tenants/{{TENANT_ENV}}/{{TENANT_OS}}/{{TENANT_NAME}}

  destination:
    server: https://kubernetes.default.svc

    namespace: {{TENANT_NAMESPACE}}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
