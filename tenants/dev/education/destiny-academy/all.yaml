apiVersion: v1
kind: Namespace

metadata:
  name: education-destiny-academy-dev

---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: destiny-academy
  namespace: education-destiny-academy-dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: destiny-academy

  template:
    metadata:
      labels:
        app: destiny-academy

    spec:
      containers:

        - name: destiny-academy

          image: knnrsolomon/education-os:release

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: TENANT_NAME
              value: "destiny-academy"

            - name: TENANT_OS
              value: "education"

            - name: TENANT_ENV
              value: "dev"

---

apiVersion: v1
kind: Service

metadata:
  name: destiny-academy
  namespace: education-destiny-academy-dev

spec:
  selector:
    app: destiny-academy

  ports:
    - port: 80
      targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: destiny-academy
  namespace: education-destiny-academy-dev

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  rules:

    - host: destiny-academy.education.asmglobal.cloud

      http:
        paths:

          - path: /
            pathType: Prefix

            backend:
              service:
                name: destiny-academy
                port:
                  number: 80

  tls:
    - hosts:
        - destiny-academy.education.asmglobal.cloud

      secretName: destiny-academy-education-tls
