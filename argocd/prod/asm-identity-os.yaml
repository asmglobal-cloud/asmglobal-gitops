apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: asm-identity-os
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Rgi-Asm-Global/asmglobal-platform-os.git
    targetRevision: release
    path: apps/asm-identity-os/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: asm-identity-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
