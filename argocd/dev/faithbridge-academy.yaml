apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: faithbridge-academy-dev

  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/asmglobal-cloud/asmglobal-gitops.git

    targetRevision: release

    path: tenants/dev/education/faithbridge-academy

  destination:
    server: https://kubernetes.default.svc

    namespace: education-faithbridge-academy-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
