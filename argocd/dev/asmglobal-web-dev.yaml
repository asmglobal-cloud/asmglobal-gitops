apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asmglobal-web-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/asmglobal-cloud/asmglobal-gitops.git
    targetRevision: development
    path: core/asmglobal-web-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: web-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
